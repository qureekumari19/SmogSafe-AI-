      width: 100%;

<body>
<!-- STITCH_THREEJS_START:ANIMATION_14 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_14" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_14');
  const devicePixelRatio = window.devicePixelRatio || 1;
  /**
 * ClearAir AI — Deterministic Atmospheric & Exposure Physics Engine
 * Zero-latency client-side arithmetic ensuring 100% math consistency without LLM hallucination.
 */

export const WHO_24H_PM25_GUIDELINE = 15; // ug/m3
export const UNSEALED_INFILTRATION_RATE = 0.70; // 70% outdoor PM enters typical unsealed home

/**
 * Calculates exposure reduction, toxins avoided, and protected indoor IAQ.
 * Diminishing returns model: exposure drop cannot exceed 92% (achieved only via HEPA/MERV cleanrooms).
 */
export function calculateImpact(adoptedActions, outdoorPm25, communityScale = 1) {
  if (!adoptedActions || adoptedActions.length === 0) {
    const rawIndoor = Math.round(outdoorPm25 * UNSEALED_INFILTRATION_RATE);
    return {
      pm25DropPct: 0,
      weeklyToxinsGrams: 0,
      weeklyCo2Kg: 0,
      outdoorPm25,
      unsealedIndoorPm25: rawIndoor,
      protectedIndoorPm25: rawIndoor,
      communityToxinsAvoided: 0,
      treesEquivalent: 0
    };
  }

  // Sum raw reductions
  let sumDrop = 0;
  let sumToxins = 0;
  let sumCo2 = 0;

  for (const act of adoptedActions) {
    sumDrop += act.pm25Reduction;
    sumToxins += act.toxinsAvoidedGrams;
    sumCo2 += act.co2SavedKg;
  }

  // Diminishing returns physics curve
  // drop = min(92, round(sumDrop * 0.75 + 5))
  const finalDropPct = Math.min(92, Math.max(10, Math.round(sumDrop * 0.72 + 6)));
  
  // Indoor concentrations
  const unsealedIndoor = Math.round(outdoorPm25 * UNSEALED_INFILTRATION_RATE);
  const protectedIndoor = Math.max(
    12,
    Math.round(unsealedIndoor * (1 - (finalDropPct / 100)))
  );

  // Scaled calculations
  const totalWeeklyToxins = Math.round(sumToxins);
  const totalWeeklyCo2 = Number(sumCo2.toFixed(1));
  const communityToxins = Number(((totalWeeklyToxins * communityScale) / 1000).toFixed(1));
  const treesEquivalent = Number((sumCo2 / 0.42).toFixed(1)); // ~22kg/year = ~0.42kg/week per tree

  return {
    pm25DropPct: finalDropPct,
    weeklyToxinsGrams: totalWeeklyToxins,
    weeklyCo2Kg: totalWeeklyCo2,
    outdoorPm25,
    unsealedIndoorPm25: unsealedIndoor,
    protectedIndoorPm25: protectedIndoor,
    communityToxinsAvoidedKg: communityToxins,
    treesEquivalent
  };
}

/**
 * Derives WHO benchmark multiple
 */
export function getWhoMultiple(pm25) {
  return Number((pm25 / WHO_24H_PM25_GUIDELINE).toFixed(1));
}

})();
</script>
